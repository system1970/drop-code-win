<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" />
    <title>DropCode</title>
  </head>
  <body>
    <div id="app">
      <main id="terminal-host"></main>
      <!-- Floating, hover-revealed controls: the panel is "headless" by default. -->
      <div id="controls">
        <button id="settings-button" type="button" title="Settings" aria-label="Settings">&#9881;</button>
        <button id="hide-button" type="button" title="Hide (Esc)" aria-label="Hide">&#10005;</button>
      </div>
    </div>
    <div id="settings-overlay" class="hidden" role="dialog" aria-modal="true" aria-label="Settings"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
